<title id="title">Less waiting. Strong results.</title>
<desc id="desc">Curated first replica: 50 selected attempts per product/profile, using the first provider-clean attempt per cell. Base Context mean attempt times are 27%, 37% and 39% lower than Codex at matching requested model and effort. Base completed all 150 selected attempts natively and was faster in 128 of the 141 pairs where both products fully passed and completed. Full quality and methodology are in the benchmark report.</desc>
