<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Cost per run: captured + estimated</title>
<desc id="desc">Solid bars are captured-usage API-list-rate subtotals, not invoices or complete costs. Hatching adds hypothetical Codex cost if unknown-model receipts used the profile model. All 441 Codex unpriced receipts have usage but unknown model. Eight Base receipts have known model but no usage, leaving an unquantified additional component. Sol/Astra sensitivities are scenarios, not bounds.</desc>
