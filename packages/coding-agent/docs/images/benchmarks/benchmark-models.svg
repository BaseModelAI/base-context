<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img" aria-labelledby="title description"><title id="title">Estimated API cost and mean runtime by model and effort</title><desc id="description">Scope: GPT-6.1 Sol · high + GPT-6 Astra · medium. Sol high: Base $6.75 and 377.1 seconds versus Codex $8.03 and 490.8 seconds. Astra medium: Base $23.66 and 214.0 seconds versus Codex $29.39 and 365.8 seconds. Each agent fully passes 30 of 30 selected tasks per profile. Cost bars show totals; runtime bars show means.</desc><rect x="0.00" y="0.00" width="1200.00" height="642.00" rx="20" fill="#091522"/><text x="48.00" y="42.00" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#68e0b5">TWO EXACT PROFILES / THE BREAKDOWN</text><text x="48.00" y="94.00" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#f2f7fc">Lower means in both tested profiles.</text><text x="48.00" y="132.00" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b6c6d7">30 selected runs per agent and profile · 30/30 full task passes in every group</text><rect x="48.00" y="155.00" width="14.00" height="14.00" rx="3" fill="#68e0b5"/><text x="72.00" y="169.00" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b6c6d7">Base Context 1.1.1</text><rect x="305.00" y="155.00" width="14.00" height="14.00" rx="3" fill="#97b9ee"/><text x="329.00" y="169.00" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b6c6d7">Codex 0.160.0</text><rect x="48.00" y="194.00" width="540.00" height="382.00" rx="12" fill="#112438"/><text x="72.00" y="230.00" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#f2f7fc">Estimated API cost (USD) · total</text><path d="M72.00 273.00 L72.00 526.00" fill="none" stroke="#2c415