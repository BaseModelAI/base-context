<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="609" viewBox="0 0 1200 609" role="img" aria-labelledby="title description"><title id="title">Runtime-clean strict finishes across all three benchmark models</title><desc id="description">Sol: Base Context 30 of 30, Prime Agent 18 of 30. Astra: 30 of 30 versus 19 of 30. DeepSeek: 29 of 30 versus 27 of 30. All scales start at zero and end at thirty. These are runtime-clean strict passes, not task correctness alone.</desc><rect x="0" y="0" width="1200" height="609" rx="24" fill="#081321" stroke="none"/><circle cx="1160" cy="-80" r="300" fill="#0c2334"/><circle cx="1160" cy="-80" r="225" fill="none" stroke="#183d4a" stroke-width="2"/><text x="48" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">RELIABILITY / EVERY MODEL INCLUDED</text><text x="48" y="109" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#f2f7ff">The clean-finish advantage, by model.</text><text x="48" y="151" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#b7c8dc">Terminal strict passes with a clean runtime · 30 assignments per agent and model</text><rect x="48" y="177" width="16" height="16" rx="4" fill="#64edbd" stroke="none"/><text x="75" y="193" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#b7c8dc">Base Context</text><rect x="258" y="177" width="16" height="16" rx="4" fill="#91add6" stroke="none"/><text x="285" y="193" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#b7c8dc">Prime Agent</text><rect x="48" y="219" width="352" height="287" rx="18" fill="#112337" stroke="none"/><text x="70" y="256" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#f2f7ff">gpt-5.6-sol</text><text x="70" y="291" font-family="DejaVu Sans, sans-serif" font-s