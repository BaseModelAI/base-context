<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title description"><title id="title">Base Context separates retained history from the selected model request</title><desc id="description">Retain source-backed history, select a task-aware working set with dependency closure and evidence retrieval, then send the selected model request. Stable epochs preserve accepted context choices. Budget admission is opt-in and needs supported configured profiles. Summaries are not lossless.</desc><rect x="0" y="0" width="1200" height="625" rx="24" fill="#081321" stroke="none"/><circle cx="1160" cy="-80" r="300" fill="#0c2334"/><circle cx="1160" cy="-80" r="225" fill="none" stroke="#183d4a" stroke-width="2"/><text x="48" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">DESIGN / SOURCE-BACKED WORKING SETS</text><text x="48" y="110" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#f2f7ff">Keep the source. Focus the request.</text><text x="48" y="152" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b7c8dc">Retained history and the context sent to the model are different things.</text><rect x="48" y="193" width="316" height="251" rx="18" fill="#112337" stroke="none"/><rect x="408" y="193" width="360" height="251" rx="18" fill="#112337" stroke="none"/><rect x="812" y="193" width="340" height="251" rx="18" fill="#112337" stroke="none"/><text x="72" y="233" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">01 / RETAIN</text><text x="72" y="274" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#f2f7ff">Source history</text><text x="72" y="316" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#b7c8dc">Native session records</text><text x="72" y="352" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#b7c8dc">Evidence and references</text><text x="72" y="407" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f2f7ff">Recover selected public text</text><text x="432" y="233" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">02 / SELECT + RECOVER</text><text x="432" y="274" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#f2f7ff">A focused working set</text><text x="432" y="316" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">TaskFrame: keep the task visible</text><text x="432" y="352" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">ViewUnits: keep dependencies</text><text x="432" y="388" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Retrieval: recover exact evidence</text><text x="836" y="233" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">03 / SEND</text><text x="836" y="274" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f7ff">The model request</text><text x="836" y="316" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Selected evidence + task state</text><text x="836" y="352" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Required tool-call/result groups</text><text x="836" y="407" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#f2f7ff">Opt-in request-budget admission</text><path d="M368 325 L403 325" fill="none" stroke="#64edbd" stroke-width="3"/><path d="M395 319 L403 325 L395 331" fill="none" stroke="#64edbd" stroke-width="3"/><path d="M772 325 L807 325" fill="none" stroke="#64edbd" stroke-width="3"/><path d="M799 319 L807 325 L799 331" fill="none" stroke="#64edbd" stroke-width="3"/><rect x="48" y="466" width="1104" height="60" rx="12" fill="#12372f" stroke="none"/><text x="72" y="504" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">STABLE EPOCHS</text><text x="280" y="504" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#f2f7ff">Preserve accepted context choices across subsequent requests and restoration.</text><text x="48" y="564" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Conceptual architecture, not a token-scale diagram or a separate performance experiment.</text><text x="48" y="593" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Budget checks need explicit profiles and supported providers. Compaction is not deletion; summaries can lose detail.</text></svg>
