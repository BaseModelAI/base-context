<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description"><title id="title">More clean finishes, fewer retries in one coding-harness study</title><desc id="description">Base Context: 89 of 90 terminal strict passes with a clean runtime, versus Prime Agent 64 of 90. Additional attempts: 2 versus 26. Cumulative lifecycle attempt time: 7.30 versus 9.62 hours. Historical SDK study, not measured release 1.0.0 performance.</desc><rect x="0" y="0" width="1200" height="790" rx="24" fill="#081321" stroke="none"/><circle cx="1160" cy="-80" r="300" fill="#0c2334"/><circle cx="1160" cy="-80" r="225" fill="none" stroke="#183d4a" stroke-width="2"/><text x="48" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#64edbd">SYNERISE / BASE-CONTEXT</text><text x="1152" y="48" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#b7c8dc">ONE CODING-HARNESS STUDY</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="51" font-weight="700" text-anchor="start" fill="#f2f7ff">More clean finishes.</text><text x="48" y="174" font-family="DejaVu Sans, sans-serif" font-size="51" font-weight="700" text-anchor="start" fill="#f2f7ff">Fewer retries.</text><text x="48" y="213" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#b7c8dc">30 Python tasks × 3 models · 90 task/model assignments per agent</text><rect x="48" y="249" width="704" height="348" rx="18" fill="#112337" stroke="none"/><rect x="776" y="249" width="376" height="166" rx="18" fill="#112337" stroke="none"/><rect x="776" y="431" width="376" height="166" rx="18" fill="#112337" stroke="none"/><text x="72" y="286" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#b7c8dc">STRICT PASSES WITH A CLEAN RUNTIME</text><text x="72" y="332" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#64edbd">Base Context</text><text x="728" y="332" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="end" fill="#f2f7ff">89/90</text><text x="72" y="426" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#91add6">Prime Agent</text><text x="728" y="426" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="end" fill="#f2f7ff">64/90</text><rect x="72" y="350" width="656" height="34" rx="6" fill="#1c344a" stroke="none"/><rect x="72" y="350" width="648.7111111111111" height="34" rx="6" fill="#64edbd" stroke="none"/><rect x="72" y="444" width="656" height="34" rx="6" fill="#1c344a" stroke="none"/><rect x="72" y="444" width="466.4888888888889" height="34" rx="6" fill="#91add6" stroke="none"/><path d="M72.0 490 L72.0 496" fill="none" stroke="#294058" stroke-width="1"/><text x="72.0" y="518" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#b7c8dc">0</text><path d="M290.66666666666663 490 L290.66666666666663 496" fill="none" stroke="#294058" stroke-width="1"/><text x="290.66666666666663" y="518" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#b7c8dc">30</text><path d="M509.3333333333333 490 L509.3333333333333 496" fill="none" stroke="#294058" stroke-width="1"/><text x="509.3333333333333" y="518" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#b7c8dc">60</text><path d="M728.0 490 L728.0 496" fill="none" stroke="#294058" stroke-width="1"/><text x="728.0" y="518" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#b7c8dc">90</text><text x="72" y="563" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#64edbd">+25 clean finishes</text><text x="728" y="562" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end" fill="#b7c8dc">Same 90 assignments</text><text x="800" y="283" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#b7c8dc">FEWER ADDITIONAL ATTEMPTS</text><text x="800" y="344" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700" text-anchor="start" fill="#64edbd">92.3%</text><text x="800" y="386" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f2f7ff">2 vs 26 · Base Context vs Prime Agent</text><text x="800" y="465" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#b7c8dc">LESS CUMULATIVE ATTEMPT TIME</text><text x="800" y="526" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700" text-anchor="start" fill="#64edbd">24.16%</text><text x="800" y="568" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#f2f7ff">7.30 h vs 9.62 h · all attempts</text><text x="48" y="643" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#f2f7ff">Strict task passes overall: 90/90 vs 87/90. Runtime cleanliness is a separate measure.</text><path d="M48 671 L1152 671" fill="none" stroke="#294058" stroke-width="1"/><text x="48" y="701" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Historical SDK study: Base Context 0.1.0 vs Prime Agent 0.9.4 · shared Bash · medium effort</text><text x="48" y="730" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">180 assigned cells · 208 effective attempts · at most one deferred retry per cell; failures and retries included</text><text x="48" y="759" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b7c8dc">Time is summed lifecycle duration, not campaign wall time or user latency. Not a new 1.0.0 measurement.</text></svg>
