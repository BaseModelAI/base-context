[project]
name = "base-context-skill-notion"
version = "0.1.0"
description = "Notion integration skill for Base Context (Notion's official hosted MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "base-context-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion"]
