[project]
name = "base-context-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Base Context recursion"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = ["dill"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
